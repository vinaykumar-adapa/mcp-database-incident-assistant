version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: incident_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: incident_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api_service:
    build: .
    container_name: diagnostic_api
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/incident_db
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgdata: